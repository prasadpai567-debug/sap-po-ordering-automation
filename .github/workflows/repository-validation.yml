name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository contents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f Module1.bas
          test -f README.md
          test -f sample_input.csv
          test -d tests
          if find . -type f \( -name '*.xlsm' -o -name '*.xlsb' \) | grep -q .; then
            echo 'Workbook binaries should not be committed to this public repository.' >&2
            exit 1
          fi

      - name: Run repository contract tests
        shell: bash
        run: python -m unittest discover -s tests -v
